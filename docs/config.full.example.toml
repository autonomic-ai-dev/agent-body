# Canonical integrated config for the Autonomic AI stack.
# Copy to ~/.autonomic/config.toml and edit per organ.
#
# Standalone mode: each organ may also read a legacy local config path
# (see each organ README). Integrated mode uses this file only.

[logging]
level = "info"

# --- agent-brain (MCP router, memory, hooks) ---
# Full options: agent-brain/config.example.yaml (YAML for brain-local dev)
[brain]
# data_dir defaults to ~/.autonomic/memory

# --- agent-spine (workflows, event bus) ---
[spine]
# listen = "127.0.0.1:3100"

# --- agent-heart (scheduled GC, budget gate) ---
[heart.schedule]
enabled = true
cron = "0 3 * * *"

[heart.token_budget]
enabled = true
ceiling = 8000

# --- agent-nerves (NATS bridge, default :3102) ---
[nerves]
# port = 3102

# --- agent-muscle (execution, training) ---
[muscle]
# listen = "127.0.0.1:3103"

# --- agent-immune (security, sandbox) ---
[immune]
sandbox_backend = "process" # process | seccomp | firecracker
network_blackhole = true

# --- agent-eyes (capture, DOM, optional VLM) ---
[vlm]
enabled = false
model_id = "llava-hf/llava-1.5-7b-hf"

# --- agent-mouth (Slack approvals, webhooks) ---
[mouth]
# webhook_url = "https://hooks.slack.com/services/..."
