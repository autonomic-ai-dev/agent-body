[package]
name = "agent-body-core"
version = "0.3.5"
edition = "2024"

[features]
default = []
nats = ["dep:async-nats"]

[dependencies]
anyhow = "1"
async-nats = { version = "0.39", optional = true }
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
uuid = { version = "1", features = ["v7", "serde"] }
thiserror = "2"
