[verify]
commands = [
  "bash .verify/checks/route_drift.sh",
  "cargo test --workspace",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo check --workspace",
  "sh .verify/checks/require_tests.sh --workspace",
  ".verify/playbooks/verify_full_suite.sh",
  ".verify/playbooks/verify_mcp_gateway.sh",
  ".verify/playbooks/verify_degradation.sh",
]

[verify.default]
command = ["cargo", "test", "--workspace"]
timeout_secs = 600
