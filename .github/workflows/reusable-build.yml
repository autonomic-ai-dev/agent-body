name: Reusable build

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      git_sha:
        required: true
        type: string
      target:
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build for ${{ inputs.target }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.target }}

      - uses: Swatinem/rust-cache@v2.9.1

      - name: Build
        run: cargo build --release --target ${{ inputs.target }} -p agent-body

      - name: Package
        run: |
          mkdir -p dist
          cp "target/${{ inputs.target }}/release/agent-body" "dist/agent-body-${{ inputs.target }}-${{ inputs.version }}-${{ inputs.git_sha }}"
          chmod +x "dist/agent-body-${{ inputs.target }}-${{ inputs.version }}-${{ inputs.git_sha }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: agent-body-${{ inputs.target }}
          path: dist/agent-body-${{ inputs.target }}-${{ inputs.version }}-${{ inputs.git_sha }}
          if-no-files-found: error
          retention-days: 14
